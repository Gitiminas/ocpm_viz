function legendHighlight(key,on,col){
  Array.prototype.forEach.call(document.querySelectorAll('[data-legend="'+key+'"]'),function(el){
    var target=el.matches('rect,circle,path,line')?el:(el.querySelector('rect,circle,path,line')||el);
    if(on){
      el.style.filter='drop-shadow(0 0 3px '+col+') drop-shadow(0 0 9px '+col+')';
      target.dataset.origSw=target.getAttribute('stroke-width')||'';
      target.dataset.origStroke=target.getAttribute('stroke')||'';
      target.dataset.origFillOp=target.getAttribute('fill-opacity')||'';
      var curSw=parseFloat(target.getAttribute('stroke-width'))||1.5;
      target.setAttribute('stroke-width',Math.max(curSw*2,3.5));
      if(target.getAttribute('stroke')&&target.getAttribute('stroke').indexOf('url(')===0)target.setAttribute('stroke',col);
      var curOp=parseFloat(target.getAttribute('fill-opacity'));
      if(!isNaN(curOp))target.setAttribute('fill-opacity',Math.max(curOp,0.6));
    } else {
      el.style.filter='';
      if(target.dataset.origSw!==undefined){target.setAttribute('stroke-width',target.dataset.origSw);delete target.dataset.origSw;}
      if(target.dataset.origStroke){target.setAttribute('stroke',target.getAttribute('data-grad')||target.dataset.origStroke);delete target.dataset.origStroke;}
      if(target.dataset.origFillOp!==undefined){if(target.dataset.origFillOp)target.setAttribute('fill-opacity',target.dataset.origFillOp);delete target.dataset.origFillOp;}
    }
  });
}

// minimap
var mmDrag=false, mmResizing=false;
function renderMinimap(){
  var mm=d3.select('#minimap'); mm.selectAll('*').remove();
  var mmEl=document.getElementById('minimap'), mw=mmEl.parentElement.clientWidth-20, mh=40;
  mm.attr('width',mw).attr('height',mh);
  var mmSpan=plotW()||1;
  lastNodes.forEach(function(n){
    var mx=Math.max(0,Math.min(mw,((n.x-margin.left)/mmSpan)*mw));
    var col=n.isBurst?TYPE.commit.c:TYPE[n.lane].c;
    mm.append('circle').attr('cx',mx).attr('cy',mh/2).attr('r',n.isBurst?4:2.2).attr('fill',col).attr('opacity',0.85);
  });
  var scroll=document.getElementById('scroll'), chartEl=document.getElementById('chart');
  var total=Math.max(chartEl.scrollWidth,1), vis=scroll.clientWidth;
  var fracW=Math.min(1,vis/total), fracX=total>vis?scroll.scrollLeft/(total-vis):0;
  var vw=Math.max(6,fracW*mw), vx=fracX*(mw-vw);
  var rect=mm.append('rect').attr('class','viewport').attr('x',vx).attr('y',0).attr('width',vw).attr('height',mh)
    .attr('fill','var(--color-accent)').attr('fill-opacity',0.14).attr('stroke','var(--color-accent)').attr('stroke-width',1.5).style('cursor','grab');
  function setFromClientX(clientX){
    var r=mmEl.getBoundingClientRect();
    var frac=Math.max(0,Math.min(1,(clientX-r.left-vw/2)/(mw-vw||1)));
    scroll.scrollLeft=frac*(total-vis);
  }
  rect.node().addEventListener('pointerdown',function(ev){mmDrag=true;rect.node().setPointerCapture(ev.pointerId);});
  rect.node().addEventListener('pointermove',function(ev){if(mmDrag)setFromClientX(ev.clientX);});
  rect.node().addEventListener('pointerup',function(){mmDrag=false;});
  mm.on('click',function(ev){if(ev.target===rect.node())return;setFromClientX(ev.clientX);});

  var HW=10,GRIPW=5,GRIPH=Math.min(22,mh-6);
  function invertPx(px){
    if(st.mode==='real'){var f=(px-margin.left)/plotW();return new Date(t0+f*(t1-t0));}
    var p=(px-margin.left)/plotW()*cTot;
    for(var i=1;i<cpos.length;i++){if(p<=cpos[i]){var f2=(p-cpos[i-1])/((cpos[i]-cpos[i-1])||1);return new Date(uniq[i-1]+f2*(uniq[i]-uniq[i-1]));}}
    return new Date(uniq[uniq.length-1]);
  }
  var els={l:{},r:{}};
  [['l',vx],['r',vx+vw]].forEach(function(h){
    var side=h[0],hx=h[1];
    var hit=mm.append('rect').attr('class','mmHandle').attr('x',hx-HW/2).attr('y',0).attr('width',HW).attr('height',mh)
      .attr('fill','#000').attr('fill-opacity',0).style('cursor','ew-resize');
    var grip=mm.append('rect').attr('x',hx-GRIPW/2).attr('y',(mh-GRIPH)/2).attr('width',GRIPW).attr('height',GRIPH).attr('rx',2.5)
      .attr('fill','var(--color-accent)').style('pointer-events','none');
    els[side]={hit:hit,grip:grip};
    hit.append('title').text('Drag to zoom');
    hit.node().addEventListener('pointerdown',function(ev){
      ev.stopPropagation();
      mmResizing=true;
      mmEl.setPointerCapture(ev.pointerId);
      var r0=mmEl.getBoundingClientRect();
      var startVx=vx,startVw=vw,startVis=vis,mwFix=mw;
      var anchorT=invertPx(margin.left+(side==='r'?startVx/mwFix:(startVx+startVw)/mwFix)*plotW());
      var raf=null,pending=null;
      function apply(mx){
        var newVx,newVw;
        if(side==='r'){newVw=Math.max(mwFix*0.03,Math.min(mwFix-startVx,mx-startVx));newVx=startVx;}
        else{newVx=Math.max(0,Math.min(startVx+startVw-mwFix*0.03,mx));newVw=startVx+startVw-newVx;}
        rect.attr('x',newVx).attr('width',newVw);
        els.l.grip.attr('x',newVx-GRIPW/2); els.l.hit.attr('x',newVx-HW/2);
        els.r.grip.attr('x',newVx+newVw-GRIPW/2); els.r.hit.attr('x',newVx+newVw-HW/2);
        var newFracW=newVw/mwFix;
        var newK=Math.max(MINK,Math.min(MAXK,(startVis/newFracW-margin.left-margin.right)/basePlotW));
        st.k=newK;
        var newTotal=margin.left+plotW()+margin.right;
        var anchorPx=X(anchorT);
        var newScrollLeft=side==='r'?anchorPx:(anchorPx-startVis);
        scroll.scrollLeft=Math.max(0,Math.min(newTotal-startVis,newScrollLeft));
      }
      function move(ev2){
        pending=Math.max(0,Math.min(mwFix,ev2.clientX-r0.left));
        if(raf)return;
        raf=requestAnimationFrame(function(){apply(pending);raf=null;});
      }
      function end(){
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',end);
        document.removeEventListener('pointercancel',end);
        if(raf){cancelAnimationFrame(raf);raf=null;if(pending!=null)apply(pending);}
        mmResizing=false;
        render();
      }
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',end);
      document.addEventListener('pointercancel',end);
    });
  });
}

(function(){var box=document.getElementById('tracks');
  [['issue','Issue',ISSUE_C,'circle',true],['pull_request','Pull request',PR_C,'diamond',true],['commit','Commit / push',COMMIT_C,'square',false]].forEach(function(t){
    var tp=t[0],hasComments=t[4];
    var wrap=document.createElement('div');
    var row=document.createElement('div'); row.className='sideRow on';
    row.style.cssText='display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--radius-sm)';
    var chevBtn=document.createElement('span');
    chevBtn.style.cssText='display:inline-flex;flex:0 0 auto;cursor:pointer;color:var(--color-neutral-500);transition:transform .15s ease'+(hasComments?'':';visibility:hidden');
    chevBtn.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>';
    var cbLabel=document.createElement('label');
    cbLabel.style.cssText='display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer';
    cbLabel.innerHTML='<input type="checkbox" checked style="accent-color:var(--color-accent);width:14px;height:14px;flex:0 0 auto;cursor:pointer">'+
      gly(t[3],t[2])+'<span class="mono" style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t[1]+'</span>';
    var cb=cbLabel.querySelector('input');
    var cmCbRef=null,subRef=null;
    cb.addEventListener('change',function(){
      st.tracks[tp]=cb.checked;row.classList.toggle('on',cb.checked);
      if(cmCbRef){cmCbRef.disabled=!cb.checked;subRef.style.opacity=cb.checked?'1':'0.4';subRef.style.pointerEvents=cb.checked?'auto':'none';}
      relSyncFns.forEach(function(fn){fn();});
      render();
    });
    row.appendChild(chevBtn); row.appendChild(cbLabel);
    wrap.appendChild(row);

    if(hasComments){
      var sub=document.createElement('div');
      sub.style.cssText='display:'+(st.trackOpen[tp]?'flex':'none')+';align-items:center;gap:8px;padding:4px 8px 6px 30px;opacity:'+(cb.checked?'1':'0.4');
      sub.innerHTML='<label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" checked style="accent-color:var(--color-accent);width:13px;height:13px;cursor:pointer"><span class="mono" style="font-size:11px;color:var(--color-neutral-400)">Comments</span></label>';
      var cmCb=sub.querySelector('input');
      cmCb.checked=st.showComments[tp]!==false;
      cmCb.disabled=!cb.checked; sub.style.pointerEvents=cb.checked?'auto':'none';
      cmCbRef=cmCb; subRef=sub;
      cmCb.addEventListener('change',function(){st.showComments[tp]=cmCb.checked;render();});
      chevBtn.style.transform=st.trackOpen[tp]?'rotate(90deg)':'rotate(0deg)';
      chevBtn.addEventListener('click',function(ev){
        ev.stopPropagation();
        st.trackOpen[tp]=!st.trackOpen[tp];
        chevBtn.style.transform=st.trackOpen[tp]?'rotate(90deg)':'rotate(0deg)';
        sub.style.display=st.trackOpen[tp]?'flex':'none';
      });
      wrap.appendChild(sub);
    }
    box.appendChild(wrap);
  });
})();

// relationship rows: two groups (validated / extracted), each expandable into per-object-pair sub-toggles
var relSyncFns=[];
(function(){var box=document.getElementById('relationships');
  REL_GROUPS.forEach(function(grp){
    var wrap=document.createElement('div');
    var row=document.createElement('div'); row.className='sideRow on';
    row.style.cssText='display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--radius-sm)';
    var chevBtn=document.createElement('span');
    chevBtn.style.cssText='display:inline-flex;flex:0 0 auto;cursor:pointer;color:var(--color-neutral-500);transition:transform .15s ease;transform:'+(st.relOpen[grp.key]?'rotate(90deg)':'rotate(0deg)');
    chevBtn.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>';
    var cbLabel=document.createElement('label');
    cbLabel.style.cssText='display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer';
    cbLabel.innerHTML='<input type="checkbox" checked style="accent-color:var(--color-accent);width:14px;height:14px;flex:0 0 auto;cursor:pointer"><span class="mono" style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+grp.label+'</span>';
    var masterCb=cbLabel.querySelector('input');
    row.appendChild(chevBtn); row.appendChild(cbLabel); wrap.appendChild(row);

    var sub=document.createElement('div');
    sub.style.cssText='display:'+(st.relOpen[grp.key]?'flex':'none')+';flex-direction:column;gap:2px;padding:4px 8px 6px 30px';
    var subCbs=[];
    function pairAvailable(p){return st.tracks[p.types[0]]&&st.tracks[p.types[1]];}
    function syncMaster(){
      var avail=grp.pairs.filter(pairAvailable);
      var vals=grp.pairs.map(function(p){return st.relPairs[p.k];});
      var allOn=vals.every(function(v){return v;}), allOff=vals.every(function(v){return !v;});
      masterCb.indeterminate=!allOn&&!allOff; masterCb.checked=allOn;
      masterCb.disabled=avail.length===0; cbLabel.style.opacity=avail.length===0?0.45:1;
      row.classList.toggle('on',!allOff);
      subCbs.forEach(function(entry){
        var ok=pairAvailable(entry.p);
        entry.scb.disabled=!ok; entry.srow.style.opacity=ok?1:0.45; entry.srow.style.pointerEvents=ok?'auto':'none';
      });
    }
    masterCb.addEventListener('change',function(){
      grp.pairs.forEach(function(p){if(pairAvailable(p))st.relPairs[p.k]=masterCb.checked;});
      subCbs.forEach(function(entry){if(pairAvailable(entry.p))entry.scb.checked=masterCb.checked;});
      syncMaster(); render();
    });
    grp.pairs.forEach(function(p){
      var srow=document.createElement('label'); srow.style.cssText='display:flex;align-items:center;gap:8px;cursor:pointer';
      srow.innerHTML='<input type="checkbox" checked style="accent-color:var(--color-accent);width:13px;height:13px;cursor:pointer"><span class="mono" style="font-size:11px;color:var(--color-neutral-400)">'+p.label+'</span>';
      var scb=srow.querySelector('input'); scb.checked=st.relPairs[p.k];
      scb.addEventListener('change',function(){st.relPairs[p.k]=scb.checked;syncMaster();render();});
      subCbs.push({p:p,scb:scb,srow:srow}); sub.appendChild(srow);
    });
    chevBtn.addEventListener('click',function(ev){
      ev.stopPropagation(); st.relOpen[grp.key]=!st.relOpen[grp.key];
      chevBtn.style.transform=st.relOpen[grp.key]?'rotate(90deg)':'rotate(0deg)';
      sub.style.display=st.relOpen[grp.key]?'flex':'none';
    });
    wrap.appendChild(sub); box.appendChild(wrap);
    syncMaster();
    relSyncFns.push(syncMaster);
  });
})();

// collapsible sections
Array.prototype.forEach.call(document.querySelectorAll('.collapseHeader'),function(h){
  if(h.dataset.wired)return; h.dataset.wired='1';
  h.addEventListener('click',function(){
    var el=document.getElementById(h.dataset.target);
    var collapsed=el.style.display==='none';
    el.style.display=collapsed?'flex':'none';
    h.querySelector('.chev').style.transform=collapsed?'rotate(0deg)':'rotate(-90deg)';
  });
});

// controls
function setK(v){st.k=Math.max(MINK,Math.min(MAXK,v));render();}
document.getElementById('zin').onclick=function(){setK(st.k*1.3);};
document.getElementById('zout').onclick=function(){setK(st.k/1.3);};
document.getElementById('zrst').onclick=function(){setK(1);};
Array.prototype.forEach.call(document.querySelectorAll('#modeSeg .seg-opt'),function(el){
  el.addEventListener('click',function(){
    Array.prototype.forEach.call(document.querySelectorAll('#modeSeg .seg-opt'),function(x){x.classList.remove('on');});
    el.classList.add('on');
    var m=el.dataset.mode;
    st.mode=m==='real'?'real':(m==='ordinal'?'ordinal':'highlights');
    pendingTweenFrom=buildPosMap(lastNodes);
    render();
  });
});
document.getElementById('scroll').addEventListener('wheel',function(e){if(!e.ctrlKey)return;e.preventDefault();setK(st.k*(e.deltaY<0?1.1:1/1.1));},{passive:false});

// page nav
Array.prototype.forEach.call(document.querySelectorAll('.pageTab'),function(btn){
  btn.addEventListener('click',function(){
    Array.prototype.forEach.call(document.querySelectorAll('.pageTab'),function(b){
      b.classList.remove('on'); b.style.color='var(--color-neutral-400)';
      b.style.background='none'; b.style.border='1px solid transparent';
    });
    btn.classList.add('on'); btn.style.color='var(--color-text)';
    btn.style.background='color-mix(in srgb, var(--color-accent) 16%, transparent)'; btn.style.border='1px solid var(--color-accent)';
    document.getElementById('timelinePage').style.display=btn.dataset.page==='timeline'?'flex':'none';
    document.getElementById('statsPage').style.display=btn.dataset.page==='stats'?'flex':'none';
    document.getElementById('timelineSidebarSections').style.display=btn.dataset.page==='timeline'?'flex':'none';
    document.getElementById('statsSidebarSections').style.display=btn.dataset.page==='stats'?'flex':'none';
    if(btn.dataset.page==='timeline'){measure();render();}
  });
});

function renderStats(){
  document.getElementById('statsBreadcrumb').textContent=DATA.meta.case;
  function dur(ms){return ms==null?'—':fmtDuration(Math.abs(ms));}
  var prClose=prObj.te, issueClose=issueObj.te;
  var commitTimes=commitObjs.map(function(o){return +o.ts;}).sort(function(a,b){return a-b;});
  var firstCommit=commitTimes[0], lastCommit=commitTimes[commitTimes.length-1];
  var commentEvs=evs.filter(function(e){return e.comment;});
  var issueComments=commentEvs.filter(function(e){return e.object_id===issueObj.id;}).length;
  var prComments=commentEvs.filter(function(e){return e.object_id===prObj.id;}).length;
  var uniqAuthors={}; commitObjs.forEach(function(o){if(o.vmap&&o.vmap.commit_author_name)uniqAuthors[o.vmap.commit_author_name]=1;});
  var validatedN=links.filter(function(l){return l.qualifier!=='actor'&&l.evidence!=='inferred';}).length;
  var extractedN=links.filter(function(l){return l.qualifier!=='actor'&&l.evidence==='inferred';}).length;

  var stats=[
    ['Issue open \u2192 close', dur(+issueClose-(+issueObj.ts)), '#'+issueObj.vmap.issue_number],
    ['PR open \u2192 merge', dur(+prClose-(+prObj.ts)), 'PR #'+prObj.vmap.pr_number],
    ['Issue \u2192 first commit', dur(firstCommit-(+issueObj.ts)), 'lead time'],
    ['Issue \u2192 PR opened', dur(+prObj.ts-(+issueObj.ts)), 'lead time'],
    ['PR merge \u2192 issue close', dur(+issueClose-(+prClose)), 'close latency'],
    ['Commits', String(commitObjs.length), Object.keys(uniqAuthors).length+' author(s)'],
    ['Comments', String(commentEvs.length), issueComments+' issue, '+prComments+' PR'],
    ['Actors involved', String(actors.length), 'across all events'],
    ['Links', validatedN+' validated', extractedN+' extracted']
  ];
  var grid=document.getElementById('statsGrid'); grid.innerHTML='';
  stats.forEach(function(s){
    var cell=document.createElement('div');
    cell.style.cssText='background:var(--color-neutral-900);border-radius:var(--radius-md);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0';
    cell.innerHTML='<div style="font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--color-neutral-500);line-height:1.4">'+s[0]+'</div>'+
      '<div class="mono" style="font-size:19px;font-weight:500;color:var(--color-text);line-height:1.2">'+s[1]+'</div>'+
      '<div style="font-size:11px;color:var(--color-neutral-500);line-height:1.3">'+s[2]+'</div>';
    grid.appendChild(cell);
  });

  var milestones=[
    ['Issue opened',issueObj.ts,ISSUE_C],
    ['First commit',new Date(firstCommit),COMMIT_C],
    ['PR opened',prObj.ts,PR_C],
    ['Last commit',new Date(lastCommit),COMMIT_C],
    ['PR merged',prClose,PR_C],
    ['Issue closed',issueClose,ISSUE_C]
  ].sort(function(a,b){return +a[1]-(+b[1]);});
  var ms=document.getElementById('statsMilestones'); ms.innerHTML='';
  milestones.forEach(function(m,i){
    var row=document.createElement('div');
    row.style.cssText='position:relative;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--color-neutral-300);padding:13px 4px';
    var isLast=i===milestones.length-1;
    row.innerHTML='<div style="position:relative;flex:0 0 auto;width:10px;height:10px;z-index:1">'+
      (isLast?'':'<div style="position:absolute;left:50%;top:10px;width:1px;height:44px;transform:translateX(-50%);background:var(--color-neutral-700)"></div>')+
      '<div style="width:10px;height:10px;border-radius:50%;background:'+m[2]+';box-shadow:0 0 0 3px var(--color-neutral-900)"></div></div>'+
      '<span style="flex:1;font-weight:500;color:var(--color-text)">'+m[0]+'</span>'+
      '<span class="mono" style="color:var(--color-neutral-500);font-size:11.5px">'+fmt(m[1])+'</span>';
    ms.appendChild(row);
  });
}
renderStats();
(function(){var box=document.getElementById('dashboards');
  [['statsCard','Case statistics'],['milestonesCard','Milestones']].forEach(function(d){
    var row=document.createElement('label'); row.className='sideRow on';
    row.style.cssText='display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer';
    row.innerHTML='<input type="checkbox" checked style="accent-color:var(--color-accent);width:14px;height:14px;flex:0 0 auto;cursor:pointer"><span class="mono" style="font-size:12px;flex:1">'+d[1]+'</span>';
    var cb=row.querySelector('input');
    cb.addEventListener('change',function(){document.getElementById(d[0]).style.display=cb.checked?'flex':'none';row.classList.toggle('on',cb.checked);});
    box.appendChild(row);
  });
  var soon=document.createElement('div');
  soon.style.cssText='display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-sm);opacity:0.45';
  soon.innerHTML='<input type="checkbox" disabled style="width:14px;height:14px"><span class="mono" style="font-size:12px;flex:1">Activity heatmap</span><span class="mono" style="font-size:9px;color:var(--color-neutral-500);border:1px solid var(--color-neutral-700);padding:1px 5px;border-radius:999px">Soon</span>';
  box.appendChild(soon);
  var more=document.createElement('div');
  more.style.cssText='text-align:center;padding:8px 8px 2px;color:var(--color-neutral-600);letter-spacing:0.25em;font-size:12px';
  more.textContent='\u2022\u2022\u2022';
  box.appendChild(more);
})();
(function(){var hm=document.getElementById('fakeHeatmap');
  for(var i=0;i<130;i++){var d=document.createElement('div');
    d.style.cssText='aspect-ratio:1;border-radius:2px;background:'+(Math.random()<0.3?COMMIT_C:'var(--color-neutral-800)')+';opacity:'+(0.3+Math.random()*0.7);
    hm.appendChild(d);}
})();

function go(){measure();render();}
if(!window.__ocelResizeWired){window.__ocelResizeWired=true;
var rt=null;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(go,150);});
}
go();
}
}
