<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue-to-merge OCEL timeline</title>
<link rel="stylesheet" href="_ds/nocturne-90dff482-d3ab-493c-9c6f-cf149f916d6f/styles.css">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
html,body{height:100%;margin:0;overflow:hidden}
.mono{font-family:'JetBrains Mono',monospace}
#scroll{scrollbar-width:none}
#scroll::-webkit-scrollbar:horizontal{display:none}
#scroll::-webkit-scrollbar{width:10px}
#scroll::-webkit-scrollbar-track{background:transparent}
#scroll::-webkit-scrollbar-thumb{background:var(--color-neutral-700);border-radius:6px}
.sideRow{cursor:pointer;transition:background .15s ease,border-color .15s ease;border:1px solid transparent}
.sideRow:hover{background:color-mix(in srgb, var(--color-text) 6%, transparent)}
.sideRow.on{background:color-mix(in srgb, var(--color-accent) 14%, transparent);border-color:var(--color-accent)}
#tip{position:absolute;display:none;pointer-events:none;z-index:100;width:300px;background:var(--color-surface);border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);overflow:hidden;transform:translateY(4px);opacity:0;transition:opacity .15s ease,transform .15s ease}
#tip.show{transform:translateY(0);opacity:1}
#tip .tip-accent{height:3px;width:100%}
#tip .tip-header{padding:12px 14px 10px;border-bottom:1px solid var(--color-neutral-800)}
#tip .tip-kicker{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-400);margin-bottom:5px}
#tip .tip-title{font-size:14px;font-weight:500;color:var(--color-text);line-height:1.4;word-break:break-word;font-family:var(--font-heading)}
#tip .tip-body{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
#tip .tip-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0;border-bottom:1px dashed var(--color-neutral-800)}
#tip .tip-row:last-child{border-bottom:none}
#tip .tip-row .k{font-size:10px;font-weight:500;color:var(--color-neutral-500);text-transform:uppercase;letter-spacing:.05em}
#tip .tip-row .v{font-size:12px;color:var(--color-text);text-align:right;word-break:break-word}
#tip .tip-row .v.time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--color-neutral-300)}
#tip .tip-row .v.mono{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--color-neutral-900);padding:2px 6px;border-radius:4px;color:var(--color-accent-300)}
/* A group of related rows, boxed so a repeated list reads as one section rather than
   as N unrelated rows sharing the card. Used by the commit tooltip's observation list. */
#tip .tip-group{border:1px solid var(--color-neutral-800);border-radius:var(--radius-sm);overflow:hidden;margin:2px 0}
/* Stacked, not two columns: three counts beside a label wrap into a ragged second
   line in a 300px card. The label reads as the section heading it is. */
#tip .tip-group-head{padding:7px 10px;background:var(--color-neutral-900);border-bottom:1px solid var(--color-neutral-800)}
#tip .tip-group-head .k{font-size:10px;font-weight:600;color:var(--color-neutral-500);text-transform:uppercase;letter-spacing:.05em}
#tip .tip-group-head .v{font-size:11px;color:var(--color-text);margin-top:2px}
#tip .tip-item{padding:6px 10px;border-bottom:1px solid var(--color-neutral-900)}
#tip .tip-item:last-child{border-bottom:none}
#tip .tip-item-main{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--color-text);word-break:break-word;line-height:1.35}
#tip .tip-item-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--color-neutral-500);margin-top:2px}
#tip.pinned .tip-item{cursor:pointer}
#tip.pinned .tip-item:hover{background:color-mix(in srgb, var(--color-text) 8%, transparent)}
#tip .tip-footer{padding:10px 14px;background:var(--color-neutral-900);border-top:1px solid var(--color-neutral-800)}
#tip .tip-note{display:flex;gap:7px;font-size:11px;color:var(--color-neutral-400);line-height:1.4}
#tip .tip-close{display:none;position:absolute;top:8px;right:8px;width:18px;height:18px;border:none;background:none;color:var(--color-neutral-500);cursor:pointer;font-size:14px;line-height:1;padding:0}
#tip .tip-close:hover{color:var(--color-text)}
#tip.pinned .tip-close{display:block}
#tip .pin-hint{display:none;padding:6px 14px;font-size:10px;color:var(--color-neutral-500);border-top:1px solid var(--color-neutral-800);background:var(--color-neutral-900)}
#tip.pinned .pin-hint{display:block}
#tip.pinned .tip-title{cursor:pointer}
#tip.pinned .tip-title:hover{text-decoration:underline}
#tip.pinned .tip-row{cursor:pointer}
#tip.pinned .tip-row:hover{background:color-mix(in srgb, var(--color-text) 8%, transparent)}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor}
#minimap{cursor:pointer;display:block;width:100%}
.seg .seg-opt.on{color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent)}
.seg .seg-opt:not(.on):hover{background:color-mix(in srgb, var(--color-text) 7%, transparent)}
.seg .seg-opt{cursor:pointer}
/* The FIRST level of the mode control is a switch, not a segment (decision 114): a pill
   whose active side is filled, with a radio dot as the literal indicator. It is drawn
   differently from the second-level segments on purpose — outlined alike, "Time |
   Relationships" and "Absolute | Discrete" read as equals, and they are not: the first
   decides what position means, the second refines it. Same fill language as the
   Fixtures | Database toggle in the sidebar, which is the other two-state switch here. */
.switch{border-radius:999px;background:var(--color-neutral-900);border-color:var(--color-neutral-700);padding:3px;gap:2px}
.switch .seg-opt{border-radius:999px;padding:5px 12px 5px 10px;color:var(--color-neutral-400);border-left:none;transition:background .15s ease,color .15s ease}
.switch .seg-opt::before{content:'';width:8px;height:8px;border-radius:50%;box-sizing:border-box;border:1.5px solid currentColor;opacity:.7}
.switch .seg-opt.on{background:var(--color-accent-600,#5b5bd6);color:#fff;box-shadow:none}
.switch .seg-opt.on::before{background:#fff;border-color:#fff;opacity:1}
.switch .seg-opt:not(.on):hover{background:color-mix(in srgb, var(--color-text) 9%, transparent);color:var(--color-text)}
/* ⚠️ The design system's own hover rule is `.seg-opt:not(:has(input:checked)):hover`.
   These options carry no <input>, so it matches the SELECTED one too and painted the
   filled switch grey on hover — reported as the selection "losing its colour". Stated
   explicitly for the selected side of both controls: hovering brightens, never unfills. */
.switch .seg-opt.on:hover{background:color-mix(in srgb, var(--color-accent-600,#5b5bd6) 85%, #fff);color:#fff}
.seg:not(.switch) .seg-opt.on:hover{background:color-mix(in srgb, var(--color-accent) 12%, transparent);color:var(--color-accent)}
/* One track, two thumbs. The inputs are stacked on the same rail and are transparent to
   the pointer except at the thumbs, so a click on the rail cannot make one handle leap
   across the other. */
.brushTrack{position:relative;height:26px}
.brushTrack .brushRail{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--color-neutral-700)}
.brushTrack .brushFill{position:absolute;top:11px;height:4px;border-radius:2px;background:var(--color-accent)}
.brushTrack input[type=range]{position:absolute;left:0;top:0;width:100%;height:26px;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.brushTrack input[type=range]:focus{outline:none}
.brushTrack input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px color-mix(in srgb, var(--color-accent) 45%, transparent)}
.brushTrack input[type=range]::-webkit-slider-runnable-track{background:none;border:none}
.brushTrack input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--color-accent);border:2px solid var(--color-bg);cursor:grab;margin-top:0}
.brushTrack input[type=range]::-webkit-slider-thumb:active{cursor:grabbing}
.brushTrack input[type=range]::-moz-range-track{background:none;border:none}
.brushTrack input[type=range]::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--color-accent);border:2px solid var(--color-bg);cursor:grab}
</style>
</head>
<body>
<div style="display:flex;height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow:hidden">
<aside style="width:300px;flex:0 0 auto;background:var(--color-surface);border-right:1px solid var(--color-neutral-800);display:flex;flex-direction:column;overflow-y:auto;padding:var(--space-6)">
<div style="display:flex;gap:8px;padding-bottom:var(--space-6);margin-bottom:var(--space-6);border-bottom:1px solid var(--color-neutral-800)">
<button class="pageTab on" data-page="timeline" style="box-sizing:border-box;border:1px solid var(--color-accent);background:color-mix(in srgb, var(--color-accent) 16%, transparent);cursor:pointer;font-size:13px;font-weight:500;color:var(--color-text);padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:7px"><svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="14"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>Timeline</button>
<button class="pageTab" data-page="stats" style="box-sizing:border-box;border:1px solid transparent;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--color-neutral-400);padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:7px"><svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="14"><line x1="4" x2="4" y1="20" y2="10"></line><line x1="12" x2="12" y1="20" y2="4"></line><line x1="20" x2="20" y1="20" y2="14"></line></svg>Stats</button>
</div>
<div style="margin-bottom:var(--space-8)">
<!-- "OCEL case" in the mockup. There is no case in OCPM (decision 1). -->
<div class="mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300);margin-bottom:6px">Sub-log</div>
<!--
  Which data source is live, always visible and always switchable.

  Not cosmetic. The source is selected by `?source=` and defaults to fixtures, so
  before this existed the only way to know whether you were looking at the real
  database or at 13 hand-built test bundles was to remember what you typed into the
  URL. An evaluation session run on fixtures by accident would measure the wrong
  thing and look exactly like one run on real data.
-->
<div style="margin-bottom:10px">
<div style="font-size:10px;color:var(--color-neutral-500);margin-bottom:4px">Data source</div>
<div id="sourceToggle" style="display:flex;gap:0;border:1px solid var(--color-neutral-700);border-radius:var(--radius-sm);overflow:hidden"></div>
<div id="sourceNote" class="mono" style="font-size:10px;color:var(--color-neutral-500);margin-top:4px;line-height:1.45"></div>
</div>
<div style="margin-bottom:10px">
<div style="font-size:10px;color:var(--color-neutral-500);margin-bottom:4px">Repo</div>
<div style="position:relative">
<input autocomplete="off" class="mono" id="repoInput" placeholder="Search repositories…" style="width:100%;box-sizing:border-box;background:var(--color-neutral-900);border:1px solid var(--color-neutral-700);border-radius:var(--radius-sm);color:var(--color-text);font-size:13px;font-weight:500;padding:7px 10px"/>
<div id="repoDropdown" style="display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;background:var(--color-surface);border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);overflow:hidden"></div>
</div>
</div>
<div>
<div style="font-size:10px;color:var(--color-neutral-500);margin-bottom:4px">Start from</div>
<div style="position:relative">
<input autocomplete="off" class="mono" id="objectInput" placeholder="Search issue / PR / commit…" style="width:100%;box-sizing:border-box;background:var(--color-neutral-900);border:1px solid var(--color-neutral-700);border-radius:var(--radius-sm);color:var(--color-text);font-size:13px;font-weight:500;padding:7px 10px"/>
<div id="objectDropdown" style="display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;background:var(--color-surface);border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);overflow-y:auto;max-height:220px"></div>
</div>
<!--
  Written by updateTraversalInfo(), and what it holds depends on the source.

  Against the DATABASE the traversal degree is a real 0-2 stepper: get_object_graph takes
  it as a parameter, so the condition decision 35 set has been met (decision 72). On
  FIXTURES it stays text, for decision 35's original reason - the degree was fixed when
  the fixture was built, so a stepper there would be a control that silently does nothing.

  Corrected 2026-08-16: this comment said the degree was read-only, full stop.
-->
<div id="traversalInfo" class="mono" style="font-size:10px;color:var(--color-neutral-500);margin-top:6px;line-height:1.5"></div>
</div>
</div>
<div id="timelineSidebarSections" style="display:flex;flex-direction:column">
<!--
  Views sits directly under the sub-log, above the controls that refine it.

  That is the order of the task: choose what you are looking at, choose how you want to
  see it, then adjust. A saved view sets every toggle below at once, so meeting it after
  those toggles invited people to arrange the sidebar by hand and only then discover
  that one click already did it — and worse, applying a preset then silently rewrote the
  work they had just done further up the page.
-->
<div style="margin-bottom:var(--space-8)">
<div class="collapseHeader" data-target="presets" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);cursor:pointer">
<span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-500)">Views</span>
<span class="chev" style="display:inline-flex;transition:transform .15s ease;color:var(--color-neutral-500)"><svg fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="12"><path d="M6 9l6 6 6-6"></path></svg></span>
</div>
<div id="presets" style="display:flex;flex-direction:column;gap:4px"></div>
</div>
<div style="margin-bottom:var(--space-8)">
<div class="collapseHeader" data-target="lanes" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);cursor:pointer">
<span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-500)">Lanes</span>
<span class="chev" style="display:inline-flex;transition:transform .15s ease;color:var(--color-neutral-500)"><svg fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="12"><path d="M6 9l6 6 6-6"></path></svg></span>
</div>
<div id="lanes" style="display:flex;flex-direction:column;gap:4px"></div>
</div>
<div style="margin-bottom:var(--space-8)">
<div class="collapseHeader" data-target="relationships" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);cursor:pointer">
<span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-500)">Relationships</span>
<span class="chev" style="display:inline-flex;transition:transform .15s ease;color:var(--color-neutral-500)"><svg fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="12"><path d="M6 9l6 6 6-6"></path></svg></span>
</div>
<div id="relationships" style="display:flex;flex-direction:column;gap:4px"></div>
</div>
<div style="margin-bottom:var(--space-8)">
<div class="collapseHeader" data-target="bursts" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);cursor:pointer">
<span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-500)">Folding</span>
<span class="chev" style="display:inline-flex;transition:transform .15s ease;color:var(--color-neutral-500)"><svg fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="12"><path d="M6 9l6 6 6-6"></path></svg></span>
</div>
<div id="bursts" style="display:flex;flex-direction:column;gap:4px"></div>
</div>
<div style="margin-bottom:var(--space-8)">
<div class="collapseHeader" data-target="actorsWrap" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);cursor:pointer">
<span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-500)">Actors</span>
<span class="chev" style="display:inline-flex;transition:transform .15s ease;color:var(--color-neutral-500)"><svg fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="12"><path d="M6 9l6 6 6-6"></path></svg></span>
</div>
<div id="actorsWrap" style="display:flex;flex-direction:column">
<input autocomplete="off" class="mono" id="actorSearch" placeholder="Search actors…" style="width:100%;box-sizing:border-box;background:var(--color-neutral-900);border:1px solid var(--color-neutral-700);border-radius:var(--radius-sm);color:var(--color-text);font-size:12px;padding:6px 9px;margin-bottom:6px"/>
<div id="actors" style="display:flex;flex-direction:column;gap:4px"></div>
</div>
</div>
<div>
<div class="collapseHeader" data-target="legend" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);cursor:pointer">
<span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-500)">Legend</span>
<span class="chev" style="display:inline-flex;transition:transform .15s ease;color:var(--color-neutral-500)"><svg fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="12"><path d="M6 9l6 6 6-6"></path></svg></span>
</div>
<div id="legend" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
</div>
<div id="statsSidebarSections" style="display:none;flex-direction:column">
<div style="margin-bottom:var(--space-8)">
<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:var(--space-3)">Dashboards</div>
<div id="dashboards" style="display:flex;flex-direction:column;gap:4px"></div>
</div>
</div>
</aside>
<div id="actorCard" style="display:none;position:fixed;z-index:200;width:290px;background:var(--color-surface);border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);overflow:hidden"></div>
<div id="degreeStepper" style="display:none;position:fixed;align-items:center;gap:2px;background-color:var(--color-neutral-800);border:1px solid var(--color-neutral-700);border-radius:999px;box-shadow:var(--shadow-md);padding:3px 4px;z-index:9999">
<span id="degMinus" style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:var(--color-neutral-300);font-size:14px;user-select:none">&minus;</span>
<span class="mono" style="font-size:11px;color:var(--color-text);min-width:34px;text-align:center">Deg <span id="degVal">1</span></span>
<span id="degPlus" style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:var(--color-neutral-300);font-size:14px;user-select:none">+</span>
</div>
<main id="timelinePage" style="flex:1;min-width:0;display:flex;flex-direction:column;padding:var(--space-6) var(--space-8);gap:var(--space-4);overflow:hidden">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-6);flex:0 0 auto;flex-wrap:wrap">
<div style="flex:1 1 auto;min-width:0">
<h1 style="font-size:20px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Issue-to-merge OCEL timeline</h1>
<div class="mono" id="breadcrumb" style="font-size:12px;color:var(--color-neutral-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">…</div>
</div>
<div style="display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap">
<div class="mono" id="focusInfo" style="font-size:11px;color:var(--color-neutral-500)">No focus</div>
<!--
  The mode control has two levels (decision 114). The FIRST chooses what position means:
  Time — the timeline, x is a time axis — or Relationships, which releases the time axis
  and lets position encode relationship structure (time is demoted, not deleted: it moves
  to the edge arrowheads, the time brush and the hovercard). The SECOND refines the first:
  under Time, which time axis (Absolute is linear in real time, Discrete is evenly spaced
  by event order); under Relationships, which arrangement (Rows or Clusters). Only the
  second-level control that applies is shown — the other would be a control that silently
  does nothing, the rule this project applies to the traversal stepper and the minimap.

  markMode() in main.js is the one place that reads state.mode into these three segments.
-->
<div class="seg switch" id="facetSeg" role="radiogroup" aria-label="What position means">
<div class="seg-opt on" data-facet="time" title="Position encodes time: a timeline with lanes and an axis"><span>Time</span></div>
<div class="seg-opt" data-facet="relationships" title="Release the time axis — position encodes relationships instead"><span>Relationships</span></div>
</div>
<div class="seg" id="timeSeg">
<div class="seg-opt on" data-mode="absolute" title="Absolute: linear in real time"><span>Absolute</span></div>
<div class="seg-opt" data-mode="discrete" title="Discrete: events evenly spaced by order; long gaps annotated"><span>Discrete</span></div>
</div>
<div class="seg" id="layoutSeg" style="display:none">
<div class="seg-opt on" data-layout="layered" title="Rows: issues, then pull requests, then commits"><span>Rows</span></div>
<div class="seg-opt" data-layout="cluster" title="Clusters: each pull request a hub, its commits fanning around it"><span>Clusters</span></div>
</div>
<div style="display:flex;gap:2px;border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);padding:2px">
<button aria-label="Zoom out" class="btn btn-icon" id="zout"><svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24" width="16"><line x1="5" x2="19" y1="12" y2="12"></line></svg></button>
<button aria-label="Reset the view" title="Reset the view: zoom, dragged marks, and the time range" class="btn btn-icon" id="zrst"><svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button>
<button aria-label="Zoom in" class="btn btn-icon" id="zin"><svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24" width="16"><line x1="5" x2="19" y1="12" y2="12"></line><line x1="12" x2="12" y1="5" y2="19"></line></svg></button>
</div>
</div>
</div>
<!--
  Hidden in the relationships time mode: the minimap is a *time* overview, and that mode has no time
  axis for it to describe. Its space is given back rather than blanked, so nothing reads
  as a strip that failed to draw. See onRendered in main.js.
-->
<div id="minimapWrap" style="flex:0 0 auto;border:1px solid var(--color-neutral-800);border-radius:var(--radius-md);background:var(--color-neutral-900);padding:8px 10px">
<svg id="minimap"></svg>
</div>
<!--
  The time brush, in the slot the minimap vacates in relationships mode.

  Deliberately the same piece of the screen: it is where a time overview already lives, so
  a reader looking for "when" looks in one place whichever mode is on. Relationships mode releases
  the time axis, and this is the control that gives time back — dimming what was not alive
  in the chosen window rather than removing it, so the shape of the whole sub-log stays
  visible behind the part being asked about.
-->
<div id="timeBrushWrap" style="display:none;flex:0 0 auto;border:1px solid var(--color-neutral-800);border-radius:var(--radius-md);background:var(--color-neutral-900);padding:8px 12px">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px">
<span style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-500)">Alive during</span>
<span class="mono" id="timeBrushLabel" style="font-size:10.5px;color:var(--color-neutral-400)"></span>
</div>
<!--
  One track, two handles. Two separate sliders side by side read as two independent
  settings rather than as the two ends of one range, which is what they are.

  Built from two overlaid range inputs rather than from scratch, so the handles keep the
  keyboard behaviour a range input already has — arrow keys, Home and End — which a
  hand-rolled pair of draggable divs would have had to reimplement and probably would not
  have. The inputs take no pointer events except on their thumbs, so clicking the track
  does not make one of them jump over the other.
-->
<div class="brushTrack" id="timeBrushTrack">
<div class="brushRail"></div>
<div class="brushFill" id="timeBrushFill"></div>
<input type="range" id="timeBrushFrom" min="0" max="1000" value="0" aria-label="Range start">
<input type="range" id="timeBrushTo" min="0" max="1000" value="1000" aria-label="Range end">
</div>
</div>
<div id="wrap" style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column">
<div id="scroll" style="flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;border:1px solid var(--color-neutral-800);border-radius:var(--radius-md);background:var(--color-bg)">
<!--
  Placeholder text — "choose a seed", "could not render" — goes HERE, never into #chart.
  #chart holds the one <svg> the timeline creates at startup and holds a closure
  reference to for the rest of the session. Writing innerHTML into #chart detaches
  that svg, and every later render then draws correctly into a node that is no longer
  in the document: no error, no picture. Keeping the two as siblings is what makes
  that impossible rather than merely avoided.
-->
<div id="chartMessage" style="display:none"></div>
<div id="chart"></div>
</div>
<div id="tip"></div>
<div id="toast" class="mono" style="display:none;position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:150;background:var(--color-surface);border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:7px 14px;font-size:11.5px;color:var(--color-text)"></div>
</div>
<!--
  Always-visible summary of what is currently filtered out. Presets and toggles buy
  a lot of flexibility at the cost of hidden dependencies: a sparse timeline reads
  as "few links" when the truth may be "links switched off". This is the mitigation,
  and it is deliberately not dismissible while anything is hidden.

  ⚠️ **BELOW the chart, and that is the whole point.** It used to sit above the minimap,
  so the first thing you hid pushed the entire graph down — and comparing before with
  after is exactly why you toggled. Watching a lane disappear is the reading; a picture
  that jumps at the same moment destroys it. Here it takes its space from the bottom of
  the scroll area, so the top of the timeline never moves.

  Below the chart rather than floating over it, because decision 27 requires it be
  impossible to miss: an overlay would cover the last lane, and covering data to report
  hidden data is the wrong trade.
-->
<div id="hiddenBanner" style="display:none;flex:0 0 auto"></div>
</main>
<main id="statsPage" style="flex:1;min-width:0;display:none;flex-direction:column;padding:var(--space-8);overflow:auto">
<h1 style="font-size:20px;margin:0 0 6px">Sub-log statistics</h1>
<div class="mono" style="font-size:12px;color:var(--color-neutral-400);margin-bottom:var(--space-6)" id="statsBreadcrumb">…</div>
<!--
  This page's message surface, and a sibling of the dashboards for the same reason
  #chartMessage is a sibling of #chart: the renderer owns what is inside, and a message
  written there would destroy it.

  Without one, an exception in renderStats rendered an *empty dashboard* — the
  explanation went to #chartMessage, which belongs to the timeline page and is not on
  screen while this one is. A blank page with no error reads as "this sub-log has no
  data", which is the wrong-picture-no-error failure this project keeps finding.
-->
<div id="statsMessage" style="display:none"></div>
<div id="statsContent" style="display:flex;flex-wrap:wrap;gap:var(--space-6);align-items:flex-start">
<div class="card elev-sm" id="statsCard" style="flex:3 1 620px;min-width:520px;padding:var(--space-6)">
<div class="card-kicker">Dashboard</div>
<div class="card-title" style="margin-bottom:var(--space-4)">Per-object statistics</div>
<div id="statsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px"></div>
</div>
<div class="card elev-sm" id="landmarksCard" style="flex:1 1 280px;min-width:280px;padding:var(--space-6)">
<div class="card-kicker">Dashboard</div>
<div class="card-title" style="margin-bottom:var(--space-4)">Landmarks</div>
<div id="statsLandmarks" style="position:relative;display:flex;flex-direction:column"></div>
</div>
<!--
  The mockup's third card was a blurred activity heatmap filled with Math.random(),
  behind an "In progress / This dashboard isn't built yet" overlay, plus a disabled
  "Activity heatmap · Soon" sidebar row and a "•••" placeholder. All removed:
  fabricated placeholder UI is forbidden, and in a task-based usability evaluation a
  fake dashboard invites participants to critique something that does not exist.
-->
</div>
</main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
